<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Començar partida</title>
    <link rel="stylesheet" href="css/game.css">
</head>

<body>
    <header>
        <button class="tornar">&lt;&lt; Tornar</button>
        <button class="instruccions">Instruccions</button>
        <div class="input-container">
            <span>Nom del jugador:</span>
            <input type="password" placeholder="Introdueix una paraula">
            <button>👁️</button>
        </div>
        <button id="startGame">Començar partida</button>
    </header>

    <div class="title">COMENÇAR PARTIDA</div>

    <div class="game-container">
        <div class="scoreboard">
            <span></span>
            <p>PUNTS PARTIDES ACTUALS <br></p>
            <p>TOTAL PARTIDES <br></p>
            <p>PARTIDES GUANYADES <br></p>
            <p>PARTIDA AMB MÉS PUNTS <br></p>
        </div>
        <div class="game-box">
            <img src="images/img_1.png" alt="Globo">
        </div>
    </div>

    <div class="alphabet">

    </div>

    <script src="js/joc.js"></script>
</body>

</html>
